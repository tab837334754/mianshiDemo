jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [dev.178778.xyz, dev.domain2.xyz]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 16
          
      - name: Install dependencies
        run: npm install
      
      - name: Build for ${{ matrix.domain }}
        run: |
          echo "VITE_DEPLOY_DOMAIN=${{ matrix.domain }}" > .env.production
          npm run build
          
      - name: Deploy ${{ matrix.domain }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ${{ matrix.domain }}
          # 使用不同的目标分支
          destination_dir: ${{ matrix.domain }}
